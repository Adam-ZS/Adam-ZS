<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal window frame -->
  <rect x="0" y="0" width="720" height="340" rx="8" fill="url(#termBg)" stroke="#122414" stroke-width="1.5"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="32" rx="8" fill="#161b22"/>
  <rect x="0" y="24" width="720" height="8" fill="#161b22"/>
  
  <!-- Window buttons -->
  <circle cx="20" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="5" fill="#28c840"/>
  
  <!-- Title text -->
  <text x="360" y="21" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12" fill="#8b949e" text-anchor="middle">adam.zs@kali: ~/red-team</text>

  <!-- Terminal content -->
  <g font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="13">
    
    <!-- Prompt 1: whoami -->
    <text x="16" y="60" fill="#00ff88" filter="url(#glow)">┌──(</text>
    <text x="56" y="60" fill="#ffcc44">adam.zs</text>
    <text x="126" y="60" fill="#00ff88">㉿</text>
    <text x="146" y="60" fill="#ffcc44">kali</text>
    <text x="175" y="60" fill="#00ff88">)-[</text>
    <text x="198" y="60" fill="#4488ff">~/red-team</text>
    <text x="280" y="60" fill="#00ff88">]</text>
    
    <text x="16" y="80" fill="#00ff88">└─$</text>
    <text x="52" y="80" fill="#b8d4bc">whoami</text>
    <text x="72" y="100" fill="#b8d4bc">→ adam.zs@cybersec</text>

    <!-- Prompt 2: pwd -->
    <text x="16" y="128" fill="#00ff88">┌──(</text>
    <text x="56" y="128" fill="#ffcc44">adam.zs</text>
    <text x="126" y="128" fill="#00ff88">㉿</text>
    <text x="146" y="128" fill="#ffcc44">kali</text>
    <text x="175" y="128" fill="#00ff88">)-[</text>
    <text x="198" y="128" fill="#4488ff">~/red-team</text>
    <text x="280" y="128" fill="#00ff88">]</text>
    
    <text x="16" y="148" fill="#00ff88">└─$</text>
    <text x="52" y="148" fill="#b8d4bc">pwd</text>
    <text x="72" y="168" fill="#b8d4bc">→ /home/adam/red-team</text>

    <!-- Prompt 3: echo $JOKE -->
    <text x="16" y="196" fill="#00ff88">┌──(</text>
    <text x="56" y="196" fill="#ffcc44">adam.zs</text>
    <text x="126" y="196" fill="#00ff88">㉿</text>
    <text x="146" y="196" fill="#ffcc44">kali</text>
    <text x="175" y="196" fill="#00ff88">)-[</text>
    <text x="198" y="196" fill="#4488ff">~/red-team</text>
    <text x="280" y="196" fill="#00ff88">]</text>
    
    <text x="16" y="216" fill="#00ff88">└─$</text>
    <text x="52" y="216" fill="#b8d4bc">echo $JOKE</text>
    
    <!-- Joke output - multi line -->
    <text x="72" y="238" fill="#cc44ff">→</text>
    <text x="88" y="238" fill="#b8d4bc">"there are only 10 types of people in this world —</text>
    <text x="88" y="258" fill="#b8d4bc">those who understand binary and those who don't"</text>
    
    <!-- Blinking cursor -->
    <rect x="280" y="296" width="8" height="14" fill="#00ff88" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

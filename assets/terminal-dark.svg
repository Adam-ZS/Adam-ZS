<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Inside Adam's workspace</title><desc id="desc">Security research, developer tools, and hardware curiosity. Current project: HoneySentinel. Stay curious. Keep building.</desc>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#263f39" stroke-width=".6"/></pattern>
<radialGradient id="halo"><stop stop-color="#59efa5" stop-opacity=".12"/><stop offset="1" stop-color="#080f10" stop-opacity="0"/></radialGradient>
</defs>
<style>
text { font-family: ui-monospace, 'Liberation Mono', Consolas, monospace; }
.label { fill:#9bb9ac; font-size:12px; letter-spacing:2px; }
.orbit { transform-origin:800px 174px; animation:rotate 40s linear infinite; }
.signal { animation:signal 5s ease-in-out infinite; }
.cursor { animation:blink 1.4s step-end infinite; }
@keyframes rotate { to { transform:rotate(360deg); } }
@keyframes signal { 50% { opacity:.35; } }
@keyframes blink { 50% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { .orbit,.signal,.cursor { animation:none; } }
</style>
<rect x="1" y="1" width="998" height="388" rx="18" fill="#080f10" stroke="#263f39"/>


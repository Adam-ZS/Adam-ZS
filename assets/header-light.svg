<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Adam ZS — security research and engineering</title><desc id="desc">A green and amber circuit-inspired personal banner with an AZ monogram. Software, systems, and hardware.</desc>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c8d6ca" stroke-width=".6"/></pattern>
<radialGradient id="halo"><stop stop-color="#137a4b" stop-opacity=".12"/><stop offset="1" stop-color="#f4f8f3" stop-opacity="0"/></radialGradient>
</defs>
<style>
text { font-family: ui-monospace, 'Liberation Mono', Consolas, monospace; }
.label { fill:#526c5d; font-size:12px; letter-spacing:2px; }
.orbit { transform-origin:800px 174px; animation:rotate 40s linear infinite; }
.signal { animation:signal 5s ease-in-out infinite; }
.cursor { animation:blink 1.4s step-end infinite; }
@keyframes rotate { to { transform:rotate(360deg); } }
@keyframes signal { 50% { opacity:.35; } }
@keyframes blink { 50% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { .orbit,.signal,.cursor { animation:none; } }
</style>
<rect x="1" y="1" width="998" height="358" rx="18" fill="#f4f8f3" stroke="#c8d6ca"/>

<rect x="18" y="18" width="964" height="324" rx="10" fill="url(#grid)" opacity=".6"/>
<circle cx="800" cy="174" r="168" fill="url(#halo)"/>
<path d="M40 70V40H70 M930 40H960V70 M40 290V320H70 M930 320H960V290" fill="none" stroke="#137a4b" stroke-width="2"/>
<text x="64" y="72" class="label">ADAM-ZS / PERSONAL LAB</text>
<circle cx="627" cy="67" r="4" fill="#896215" class="signal"/>
<text x="60" y="166" fill="#152b23" font-size="82" font-weight="700" letter-spacing="-5">ADAM ZS<tspan fill="#137a4b">.</tspan></text>
<text x="64" y="212" fill="#137a4b" font-size="23">Security research. Thoughtful engineering.</text>
<text x="64" y="250" fill="#526c5d" font-size="17">Understand the system. Build something better.</text>
<path d="M64 277H618" stroke="#c8d6ca"/>
<text x="64" y="304" class="label">01 / SOFTWARE</text><text x="254" y="304" class="label">02 / SYSTEMS</text><text x="439" y="304" class="label">03 / HARDWARE</text>
<circle cx="800" cy="174" r="108" stroke="#c8d6ca" fill="none"/>
<circle cx="800" cy="174" r="91" stroke="#137a4b" stroke-width="1.5" stroke-dasharray="3 12" fill="none" class="orbit"/>
<path d="M800 103L862 138V210L800 245L738 210V138Z" fill="#e6eee5" stroke="#137a4b" stroke-width="1.5"/>
<path d="M763 200L783 150L803 200M771 184H795M815 151H840L813 198H840" fill="none" stroke="#152b23" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
<path d="M691 174H661M908 174H938M800 65V45M800 283V303" stroke="#137a4b"/>
<circle cx="692" cy="174" r="4" fill="#896215"/><circle cx="908" cy="174" r="4" fill="#137a4b" class="signal"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="50%" stop-color="#e8f5ef"/>
      <stop offset="100%" stop-color="#f0faf4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008844"/>
      <stop offset="50%" stop-color="#00aa55"/>
      <stop offset="100%" stop-color="#008844"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#008844" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle border -->
  <rect x="2" y="2" width="896" height="256" fill="none" stroke="#008844" stroke-width="0.5" rx="10" opacity="0.08"/>

  <!-- Grid -->
  <g stroke="#008844" stroke-width="0.3" opacity="0.04">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="260"/>
    <line x1="360" y1="0" x2="360" y2="260"/>
    <line x1="540" y1="0" x2="540" y2="260"/>
    <line x1="720" y1="0" x2="720" y2="260"/>
  </g>

  <!-- Decorative node -->
  <circle cx="30" cy="130" r="2" fill="#008844" opacity="0.06"/>
  <circle cx="870" cy="130" r="2" fill="#008844" opacity="0.06"/>

  <!-- Main name with accent -->
  <text x="450" y="110" font-family="'Courier New','Consolas',monospace" font-size="44" fill="url(#accent)" text-anchor="middle" font-weight="bold" filter="url(#soft)" letter-spacing="6">
    ADAM ZS
  </text>

  <!-- Underline -->
  <rect x="320" y="128" width="260" height="1" fill="#008844" opacity="0.2"/>

  <!-- Role -->
  <text x="450" y="155" font-family="'Courier New','Consolas',monospace" font-size="11" fill="#3d5e42" text-anchor="middle" letter-spacing="5" opacity="0.5">
    CYBERSECURITY ENGINEER
  </text>

  <!-- Focus tags -->
  <circle cx="210" cy="194" r="2.5" fill="#008844" opacity="0.2"/>
  <text x="218" y="197" font-family="'Courier New','Consolas',monospace" font-size="10" fill="#008844" opacity="0.4">pentesting</text>

  <circle cx="380" cy="194" r="2.5" fill="#008844" opacity="0.2"/>
  <text x="388" y="197" font-family="'Courier New','Consolas',monospace" font-size="10" fill="#008844" opacity="0.4">threat intel</text>

  <circle cx="539" cy="194" r="2.5" fill="#008844" opacity="0.2"/>
  <text x="547" y="197" font-family="'Courier New','Consolas',monospace" font-size="10" fill="#008844" opacity="0.4">hardware sec</text>

  <circle cx="700" cy="194" r="2.5" fill="#008844" opacity="0.2"/>
  <text x="708" y="197" font-family="'Courier New','Consolas',monospace" font-size="10" fill="#008844" opacity="0.4">AI security</text>

  <!-- Bottom terminal bar -->
  <rect x="20" y="230" width="860" height="1" fill="#008844" opacity="0.08"/>
  <text x="30" y="244" font-family="'Courier New','Consolas',monospace" font-size="10" fill="#3d5e42" opacity="0.4">
    <tspan fill="#008844" filter="url(#soft)">adam-zs@github</tspan>:<tspan fill="#3d5e42">~</tspan>$ <tspan fill="#3d5e42" opacity="0.7">cat</tspan> <tspan fill="#3d5e42" opacity="0.4">profile.json</tspan>
  </text>

  <!-- Cursor -->
  <rect x="193" y="235" width="7" height="13" fill="#008844" opacity="0.3" rx="1">
    <animate attributeName="opacity" values="0.3;0;0.3" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>

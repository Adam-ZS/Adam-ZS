<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="50%" stop-color="#e8f5ef"/>
      <stop offset="100%" stop-color="#f0faf4"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#008844" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#008844"/>
      <stop offset="80%" stop-color="#008844" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="8"/>

  <!-- Subtle grid -->
  <g fill="#008844" opacity="0.04">
    <circle cx="45" cy="30" r="1"/><circle cx="135" cy="30" r="1"/>
    <circle cx="225" cy="30" r="1"/><circle cx="315" cy="30" r="1"/>
    <circle cx="405" cy="30" r="1"/><circle cx="495" cy="30" r="1"/>
    <circle cx="585" cy="30" r="1"/><circle cx="675" cy="30" r="1"/>
    <circle cx="765" cy="30" r="1"/><circle cx="855" cy="30" r="1"/>
    <circle cx="90" cy="65" r="1"/><circle cx="180" cy="65" r="1"/>
    <circle cx="270" cy="65" r="1"/><circle cx="360" cy="65" r="1"/>
    <circle cx="450" cy="65" r="1"/><circle cx="540" cy="65" r="1"/>
    <circle cx="630" cy="65" r="1"/><circle cx="720" cy="65" r="1"/>
    <circle cx="810" cy="65" r="1"/>
    <circle cx="45" cy="100" r="1"/><circle cx="135" cy="100" r="1"/>
    <circle cx="225" cy="100" r="1"/><circle cx="315" cy="100" r="1"/>
    <circle cx="405" cy="100" r="1"/><circle cx="495" cy="100" r="1"/>
    <circle cx="585" cy="100" r="1"/><circle cx="675" cy="100" r="1"/>
    <circle cx="765" cy="100" r="1"/><circle cx="855" cy="100" r="1"/>
    <circle cx="90" cy="135" r="1"/><circle cx="180" cy="135" r="1"/>
    <circle cx="270" cy="135" r="1"/><circle cx="360" cy="135" r="1"/>
    <circle cx="450" cy="135" r="1"/><circle cx="540" cy="135" r="1"/>
    <circle cx="630" cy="135" r="1"/><circle cx="720" cy="135" r="1"/>
    <circle cx="810" cy="135" r="1"/>
    <circle cx="45" cy="170" r="1"/><circle cx="135" cy="170" r="1"/>
    <circle cx="225" cy="170" r="1"/><circle cx="315" cy="170" r="1"/>
    <circle cx="405" cy="170" r="1"/><circle cx="495" cy="170" r="1"/>
    <circle cx="585" cy="170" r="1"/><circle cx="675" cy="170" r="1"/>
    <circle cx="765" cy="170" r="1"/><circle cx="855" cy="170" r="1"/>
  </g>

  <!-- Outer terminal box -->
  <rect x="20" y="15" width="860" height="170" rx="6" fill="none" stroke="#008844" stroke-width="0.5" opacity="0.3"/>

  <!-- Title bar dots -->
  <circle cx="36" cy="27" r="4" fill="#ff5f56" opacity="0.4"/>
  <circle cx="52" cy="27" r="4" fill="#ffbd2e" opacity="0.4"/>
  <circle cx="68" cy="27" r="4" fill="#27c93f" opacity="0.4"/>

  <!-- Tab bar -->
  <rect x="80" y="18" width="160" height="18" rx="3" fill="#008844" opacity="0.04"/>
  <text x="120" y="31" font-family="'Courier New','Consolas',monospace" font-size="9" fill="#008844" text-anchor="middle" font-weight="bold" opacity="0.6">profile@adam-zs: ~</text>

  <!-- Main name -->
  <text x="450" y="80" font-family="'Courier New','Consolas',monospace" font-size="28" fill="#008844" text-anchor="middle" font-weight="bold" filter="url(#soft)">
    ADAM ZS
  </text>

  <!-- Role -->
  <text x="450" y="108" font-family="'Courier New','Consolas',monospace" font-size="12" fill="#3d5e42" text-anchor="middle" letter-spacing="2">
    CYBERSECURITY  ENGINEER
  </text>

  <!-- Divider -->
  <line x1="280" y1="122" x2="620" y2="122" stroke="url(#line)" stroke-width="1"/>

  <!-- Focus tags -->
  <rect x="260" y="134" width="80" height="18" rx="3" fill="#008844" opacity="0.04"/>
  <text x="300" y="147" font-family="'Courier New','Consolas',monospace" font-size="8" fill="#008844" text-anchor="middle" opacity="0.6">pen testing</text>

  <rect x="350" y="134" width="80" height="18" rx="3" fill="#008844" opacity="0.04"/>
  <text x="390" y="147" font-family="'Courier New','Consolas',monospace" font-size="8" fill="#008844" text-anchor="middle" opacity="0.6">threat intel</text>

  <rect x="440" y="134" width="80" height="18" rx="3" fill="#008844" opacity="0.04"/>
  <text x="480" y="147" font-family="'Courier New','Consolas',monospace" font-size="8" fill="#008844" text-anchor="middle" opacity="0.6">hardware sec</text>

  <rect x="530" y="134" width="80" height="18" rx="3" fill="#008844" opacity="0.04"/>
  <text x="570" y="147" font-family="'Courier New','Consolas',monospace" font-size="8" fill="#008844" text-anchor="middle" opacity="0.6">AI security</text>

  <!-- Terminal prompt -->
  <text x="45" y="176" font-family="'Courier New','Consolas',monospace" font-size="9" fill="#3d5e42" opacity="0.7">
    <tspan fill="#008844">adam-zs@github</tspan>:<tspan fill="#3d5e42">~</tspan>$ <tspan fill="#3d5e42">cat</tspan> <tspan fill="#3d5e42" opacity="0.5">profile/README.md</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="215" y="167" width="6" height="10" fill="#008844" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0;0.4" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>

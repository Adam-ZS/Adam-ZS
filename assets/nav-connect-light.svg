<radialGradient id="halo"><stop stop-color="#137a4b" stop-opacity=".18"/><stop offset="1" stop-color="#f4f8f3" stop-opacity="0"/></radialGradient>
<linearGradient id="trace"><stop stop-color="#137a4b" stop-opacity="0"/><stop offset=".5" stop-color="#137a4b"/><stop offset="1" stop-color="#896215" stop-opacity=".2"/></linearGradient>

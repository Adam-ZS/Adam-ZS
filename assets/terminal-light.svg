<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#eaeef2"/>
    </linearGradient>
  </defs>

  <!-- Terminal window frame -->
  <rect x="0" y="0" width="720" height="340" rx="8" fill="url(#termBg)" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Yellow accent bar top -->
  <rect x="0" y="0" width="720" height="2" rx="1" fill="#ffcc44" opacity="0.8"/>

  <!-- Yellow accent dot -->
  <circle cx="680" cy="16" r="3" fill="#ffcc44" opacity="0.6"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="32" rx="8" fill="#e8ecf0"/>
  <rect x="0" y="24" width="720" height="8" fill="#e8ecf0"/>
  
  <!-- Window buttons -->
  <circle cx="20" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="5" fill="#28c840"/>
  
  <!-- Title text -->
  <text x="360" y="21" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12" fill="#57606a" text-anchor="middle">adam.zs@kali: ~/red-team</text>

  <!-- Terminal content -->
  <g font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="13">
    <text x="16" y="60" fill="#1f2328">┌──(adam.zs㉿kali)-[~/red-team]</text>
    <text x="16" y="80" fill="#1f2328">└─$ whoami</text>
    <text x="72" y="100" fill="#656d76">→ adam.zs@cybersec</text>

    <text x="16" y="128" fill="#1f2328">┌──(adam.zs㉿kali)-[~/red-team]</text>
    <text x="16" y="148" fill="#1f2328">└─$ pwd</text>
    <text x="72" y="168" fill="#656d76">→ /home/adam/red-team</text>

    <text x="16" y="196" fill="#1f2328">┌──(adam.zs㉿kali)-[~/red-team]</text>
    <text x="16" y="216" fill="#1f2328">└─$ echo $JOKE</text>
    <text x="72" y="238" fill="#656d76">→ "there are only 10 types of people in this world —</text>
    <text x="72" y="258" fill="#656d76">   those who understand binary and those who don't"</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020805"/>
      <stop offset="50%" stop-color="#0a1a0e"/>
      <stop offset="100%" stop-color="#020805"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#00ff88"/>
      <stop offset="70%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="900" height="200" fill="url(#grad)" rx="12"/>
  
  <!-- Grid dots -->
  <g fill="#00ff88" opacity="0.08">
    <circle cx="50" cy="30" r="1.5"/><circle cx="150" cy="30" r="1.5"/>
    <circle cx="250" cy="30" r="1.5"/><circle cx="350" cy="30" r="1.5"/>
    <circle cx="450" cy="30" r="1.5"/><circle cx="550" cy="30" r="1.5"/>
    <circle cx="650" cy="30" r="1.5"/><circle cx="750" cy="30" r="1.5"/>
    <circle cx="850" cy="30" r="1.5"/>
    <circle cx="100" cy="60" r="1.5"/><circle cx="200" cy="60" r="1.5"/>
    <circle cx="300" cy="60" r="1.5"/><circle cx="400" cy="60" r="1.5"/>
    <circle cx="500" cy="60" r="1.5"/><circle cx="600" cy="60" r="1.5"/>
    <circle cx="700" cy="60" r="1.5"/><circle cx="800" cy="60" r="1.5"/>
    <circle cx="50" cy="90" r="1.5"/><circle cx="150" cy="90" r="1.5"/>
    <circle cx="250" cy="90" r="1.5"/><circle cx="350" cy="90" r="1.5"/>
    <circle cx="450" cy="90" r="1.5"/><circle cx="550" cy="90" r="1.5"/>
    <circle cx="650" cy="90" r="1.5"/><circle cx="750" cy="90" r="1.5"/>
    <circle cx="850" cy="90" r="1.5"/>
    <circle cx="100" cy="120" r="1.5"/><circle cx="200" cy="120" r="1.5"/>
    <circle cx="300" cy="120" r="1.5"/><circle cx="400" cy="120" r="1.5"/>
    <circle cx="500" cy="120" r="1.5"/><circle cx="600" cy="120" r="1.5"/>
    <circle cx="700" cy="120" r="1.5"/><circle cx="800" cy="120" r="1.5"/>
    <circle cx="50" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/>
    <circle cx="250" cy="150" r="1.5"/><circle cx="350" cy="150" r="1.5"/>
    <circle cx="450" cy="150" r="1.5"/><circle cx="550" cy="150" r="1.5"/>
    <circle cx="650" cy="150" r="1.5"/><circle cx="750" cy="150" r="1.5"/>
    <circle cx="850" cy="150" r="1.5"/>
    <circle cx="100" cy="180" r="1.5"/><circle cx="200" cy="180" r="1.5"/>
    <circle cx="300" cy="180" r="1.5"/><circle cx="400" cy="180" r="1.5"/>
    <circle cx="500" cy="180" r="1.5"/><circle cx="600" cy="180" r="1.5"/>
    <circle cx="700" cy="180" r="1.5"/><circle cx="800" cy="180" r="1.5"/>
  </g>
  
  <!-- Glow line separator -->
  <rect x="50" y="145" width="800" height="1" fill="url(#line)" opacity="0.4"/>
  
  <!-- Main text -->
  <text x="450" y="72" font-family="'Courier New', monospace" font-size="22" fill="#00ff88" text-anchor="middle" font-weight="bold" filter="url(#softGlow)">
    ADAM ZS
  </text>
  <text x="450" y="98" font-family="'Courier New', monospace" font-size="13" fill="#b8d4bc" text-anchor="middle" opacity="0.8">
    Cybersecurity Engineer
  </text>
  
  <!-- Subtitle badges -->
  <rect x="280" y="115" width="340" height="22" rx="11" fill="#00ff88" opacity="0.08"/>
  <text x="450" y="131" font-family="'Courier New', monospace" font-size="10" fill="#3d5e42" text-anchor="middle">
    pen testing  ·  threat intel  ·  hardware sec  ·  AI security
  </text>
  
  <!-- Terminal prompt -->
  <text x="70" y="168" font-family="'Courier New', monospace" font-size="11" fill="#3d5e42">
    <tspan fill="#00ff88">~/profile</tspan><tspan fill="#b8d4bc">$</tspan> <tspan fill="#b8d4bc">cat</tspan> <tspan fill="#3d5e42">README.md</tspan>
  </text>
  
  <!-- Animated cursor blink -->
  <rect x="228" y="157" width="8" height="13" fill="#00ff88" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Floating particles -->
  <circle cx="100" cy="40" r="2" fill="#00ff88" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;20;40" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="50" r="1.5" fill="#00ff88" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="50;25;50" dur="3.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="300" cy="35" r="1.5" fill="#00cc66" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="5s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="cy" values="35;15;35" dur="5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="600" cy="30" r="2" fill="#00ff88" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" values="30;10;30" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <!-- Left decorative brace -->
  <text x="170" y="72" font-family="'Courier New', monospace" font-size="36" fill="#122414" text-anchor="middle">{</text>
  <!-- Right decorative brace -->
  <text x="730" y="72" font-family="'Courier New', monospace" font-size="36" fill="#122414" text-anchor="middle">}</text>
</svg>

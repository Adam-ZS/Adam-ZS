<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020805"/>
      <stop offset="30%" stop-color="#051a0d"/>
      <stop offset="60%" stop-color="#041208"/>
      <stop offset="100%" stop-color="#010403"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00ffaa"/>
      <stop offset="100%" stop-color="#00cc66"/>
    </linearGradient>
    <linearGradient id="neonGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Glow filters -->
    <filter id="heavyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feGaussianBlur stdDeviation="2" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <!-- Animated scanline gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="47%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.4"/>
      <stop offset="53%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Center glow -->
  <rect width="900" height="260" fill="url(#glowCenter)" rx="12"/>

  <!-- Border glow -->
  <rect x="2" y="2" width="896" height="256" fill="none" stroke="#00ff88" stroke-width="1" rx="10" opacity="0.15"/>
  <rect x="4" y="4" width="892" height="252" fill="none" stroke="#00ff88" stroke-width="0.5" rx="9" opacity="0.08"/>

  <!-- Cyber grid -->
  <g stroke="#00ff88" stroke-width="0.4" opacity="0.05">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="260"/>
    <line x1="360" y1="0" x2="360" y2="260"/>
    <line x1="540" y1="0" x2="540" y2="260"/>
    <line x1="720" y1="0" x2="720" y2="260"/>
  </g>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="900" height="3" fill="url(#scanGrad)">
    <animate attributeName="y" values="-10;270;-10" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Matrix-style falling dots (right side) -->
  <g font-family="monospace" font-size="8" fill="#00ff88" opacity="0">
    <text x="760" y="10">1</text>
    <text x="790" y="30">0</text>
    <text x="820" y="15">1</text>
    <text x="850" y="40">1</text>
    <text x="870" y="20">0</text>
  </g>

  <!-- Top decorative line -->
  <line x1="50" y1="25" x2="850" y2="25" stroke="#00ff88" stroke-width="0.5" opacity="0.08"/>

  <!-- Left decorative node -->
  <circle cx="30" cy="130" r="2" fill="#00ff88" opacity="0.15">
    <animate attributeName="r" values="2;3;2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <line x1="30" y1="130" x2="130" y2="60" stroke="#00ff88" stroke-width="0.5" opacity="0.06"/>

  <!-- Right decorative node -->
  <circle cx="870" cy="130" r="2" fill="#00ff88" opacity="0.15">
    <animate attributeName="r" values="2;3;2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="870" y1="130" x2="770" y2="200" stroke="#00ff88" stroke-width="0.5" opacity="0.06"/>

  <!-- Shield icon (decorative, left) -->
  <g transform="translate(80, 60)" opacity="0.08">
    <path d="M0,20 L20,0 L40,20 L40,50 L20,65 L0,50 Z" fill="none" stroke="#00ff88" stroke-width="1.5"/>
    <path d="M12,28 L20,38 L32,22" fill="none" stroke="#00ff88" stroke-width="2"/>
  </g>

  <!-- Main name with heavy neon glow -->
  <text x="450" y="110" font-family="'Courier New','Consolas',monospace" font-size="44" fill="url(#neonGrad)" text-anchor="middle" font-weight="bold" filter="url(#textGlow)" letter-spacing="6">
    ADAM ZS
  </text>

  <!-- Name reflection/shadow -->
  <text x="450" y="110" font-family="'Courier New','Consolas',monospace" font-size="44" fill="#00ff88" text-anchor="middle" font-weight="bold" letter-spacing="6" opacity="0.08" transform="scale(1, -0.15) translate(0, -750)" filter="url(#softGlow)"/>

  <!-- Underline glow bar -->
  <rect x="280" y="128" width="340" height="2" fill="#00ff88" opacity="0.3" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="320" y="128" width="260" height="1" fill="#00ff88" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Role text -->
  <text x="450" y="155" font-family="'Courier New','Consolas',monospace" font-size="11" fill="#b8d4bc" text-anchor="middle" letter-spacing="5" opacity="0.7">
    CYBERSECURITY ENGINEER
  </text>

  <!-- Focus tags with animated dots -->
  <g>
    <!-- pentesting -->
    <circle cx="210" cy="194" r="2.5" fill="#00ff88" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="218" y="197" font-family="'Courier New','Consolas',monospace" font-size="10" fill="#3d5e42">pentesting</text>

    <!-- threat intel -->
    <circle cx="380" cy="194" r="2.5" fill="#00ff88" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <text x="388" y="197" font-family="'Courier New','Consolas',monospace" font-size="10" fill="#3d5e42">threat intel</text>

    <!-- hardware sec -->
    <circle cx="539" cy="194" r="2.5" fill="#00ff88" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <text x="547" y="197" font-family="'Courier New','Consolas',monospace" font-size="10" fill="#3d5e42">hardware sec</text>

    <!-- AI security -->
    <circle cx="700" cy="194" r="2.5" fill="#00ff88" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <text x="708" y="197" font-family="'Courier New','Consolas',monospace" font-size="10" fill="#3d5e42">AI security</text>
  </g>

  <!-- Bottom terminal bar -->
  <rect x="20" y="230" width="860" height="1" fill="#00ff88" opacity="0.08"/>
  <text x="30" y="244" font-family="'Courier New','Consolas',monospace" font-size="10" fill="#3d5e42">
    <tspan fill="#00ff88" filter="url(#softGlow)">adam-zs@github</tspan>:<tspan fill="#b8d4bc" opacity="0.6">~</tspan>$ <tspan fill="#b8d4bc" opacity="0.5">cat</tspan> <tspan fill="#3d5e42">profile.json</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="193" y="235" width="7" height="13" fill="#00ff88" opacity="0.6" rx="1">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Neon ambient particles -->
  <circle cx="150" cy="45" r="2" fill="#00ff88" filter="url(#particleGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="45;20;45" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="150;160;150" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="55" r="1.5" fill="#00ff88" filter="url(#particleGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="55;25;55" dur="5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cx" values="750;740;750" dur="5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="450" cy="30" r="1" fill="#00ff88" filter="url(#particleGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="7s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="cy" values="30;10;30" dur="7s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="320" cy="50" r="1.5" fill="#00ff88" filter="url(#particleGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0.35;0" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" values="50;15;50" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="600" cy="40" r="2" fill="#00cc66" filter="url(#particleGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0.45;0" dur="5.5s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="cy" values="40;10;40" dur="5.5s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="cx" values="600;610;600" dur="5.5s" repeatCount="indefinite" begin="3s"/>
  </circle>
  <circle cx="850" cy="180" r="1.5" fill="#00ff88" filter="url(#particleGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="8s" repeatCount="indefinite" begin="4s"/>
    <animate attributeName="cy" values="180;155;180" dur="8s" repeatCount="indefinite" begin="4s"/>
  </circle>
  <circle cx="50" cy="170" r="1" fill="#00ff88" filter="url(#particleGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0.35;0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cy" values="170;145;170" dur="5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="670" cy="175" r="1.5" fill="#00ff88" filter="url(#particleGlow)" opacity="0">
    <animate attributeName="opacity" values="0;0.25;0" dur="6.5s" repeatCount="indefinite" begin="2.5s"/>
    <animate attributeName="cy" values="175;150;175" dur="6.5s" repeatCount="indefinite" begin="2.5s"/>
  </circle>

  <!-- Sparkle effects -->
  <circle cx="220" cy="85" r="1" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite" begin="1.7s"/>
  </circle>
  <circle cx="680" cy="75" r="0.8" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite" begin="3.2s"/>
  </circle>
</svg>

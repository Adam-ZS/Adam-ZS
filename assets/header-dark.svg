<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020805"/>
      <stop offset="50%" stop-color="#05120a"/>
      <stop offset="100%" stop-color="#020805"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc66"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="240" fill="url(#bg)" rx="10"/>

  <!-- Cyber grid pattern -->
  <g stroke="#00ff88" stroke-width="0.3" opacity="0.06">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="450" y1="0" x2="450" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="750" y1="0" x2="750" y2="240"/>
  </g>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="900" height="2" fill="#00ff88" opacity="0">
    <animate attributeName="y" values="0;240;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.12;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative hex-like shapes -->
  <polygon points="80,40 95,30 110,40 110,60 95,70 80,60" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.08">
    <animate attributeName="opacity" values="0.08;0.15;0.08" dur="3s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="790,170 805,160 820,170 820,190 805,200 790,190" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.08">
    <animate attributeName="opacity" values="0.08;0.15;0.08" dur="4s" repeatCount="indefinite"/>
  </polygon>

  <!-- Main name with neon glow -->
  <text x="450" y="95" font-family="'Courier New','Consolas',monospace" font-size="36" fill="url(#accent)" text-anchor="middle" font-weight="bold" filter="url(#neon)" letter-spacing="4">
    ADAM ZS
  </text>

  <!-- Role line -->
  <text x="450" y="125" font-family="'Courier New','Consolas',monospace" font-size="13" fill="#b8d4bc" text-anchor="middle" letter-spacing="3" opacity="0.9">
    CYBERSECURITY ENGINEER
  </text>

  <!-- Divider -->
  <line x1="300" y1="142" x2="600" y2="142" stroke="url(#lineGlow)" stroke-width="1"/>

  <!-- Focus tags with animated dots -->
  <circle cx="260" cy="167" r="3" fill="#00ff88" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="270" y="171" font-family="'Courier New','Consolas',monospace" font-size="11" fill="#3d5e42">pen testing</text>

  <circle cx="390" cy="167" r="3" fill="#00ff88" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <text x="400" y="171" font-family="'Courier New','Consolas',monospace" font-size="11" fill="#3d5e42">threat intel</text>

  <circle cx="520" cy="167" r="3" fill="#00ff88" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <text x="530" y="171" font-family="'Courier New','Consolas',monospace" font-size="11" fill="#3d5e42">hardware sec</text>

  <circle cx="650" cy="167" r="3" fill="#00ff88" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <text x="660" y="171" font-family="'Courier New','Consolas',monospace" font-size="11" fill="#3d5e42">AI security</text>

  <!-- Bottom terminal bar -->
  <rect x="20" y="215" width="860" height="1" fill="#122414"/>
  <text x="30" y="228" font-family="'Courier New','Consolas',monospace" font-size="9" fill="#3d5e42">
    <tspan fill="#00ff88" filter="url(#softGlow)">adam-zs@github</tspan>:<tspan fill="#b8d4bc">~</tspan>$ <tspan fill="#b8d4bc">cat</tspan> <tspan fill="#3d5e42">profile</tspan>
  </text>

  <!-- Cursor -->
  <rect x="145" y="219" width="6" height="11" fill="#00ff88" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles -->
  <circle cx="180" cy="55" r="1.5" fill="#00ff88" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="55;25;55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="70" r="2" fill="#00ff88" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="70;35;70" dur="5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="350" cy="40" r="1" fill="#00cc66" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="3.5s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="cy" values="40;15;40" dur="3.5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="600" cy="50" r="1.5" fill="#00ff88" opacity="0">
    <animate attributeName="opacity" values="0;0.35;0" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" values="50;20;50" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="850" cy="170" r="1" fill="#00ff88" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="6s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="cy" values="170;150;170" dur="6s" repeatCount="indefinite" begin="3s"/>
  </circle>
  <circle cx="50" cy="160" r="1.5" fill="#00ff88" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite" begin="1.2s"/>
    <animate attributeName="cy" values="160;140;160" dur="3s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="242" viewBox="0 0 1000 242" role="img" aria-labelledby="title">
<title id="title">HoneySentinel AI · collaborative capstone · open development fork</title>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#263f39" stroke-width=".6"/></pattern>
<radialGradient id="halo"><stop stop-color="#59efa5" stop-opacity=".18"/><stop offset="1" stop-color="#080f10" stop-opacity="0"/></radialGradient>
<linearGradient id="trace"><stop stop-color="#59efa5" stop-opacity="0"/><stop offset=".5" stop-color="#59efa5"/><stop offset="1" stop-color="#edc775" stop-opacity=".2"/></linearGradient>
</defs>
<style>
text { font-family:ui-monospace,'Liberation Mono',Consolas,monospace; fill:#eff8f2; }
.label { fill:#9bb9ac; font-size:14px; letter-spacing:2px; }
.orbit { transform-origin:790px 180px; animation:rotate 48s linear infinite; }
.reverse { animation-direction:reverse; animation-duration:65s; }
.signal { animation:pulse 5s ease-in-out infinite; }
.flow { stroke-dasharray:8 28; animation:flow 14s linear infinite; }
.cursor { animation:blink 1.4s step-end infinite; }
@keyframes rotate { to { transform:rotate(360deg); } }
@keyframes pulse { 50% { opacity:.35; } }
@keyframes flow { to { stroke-dashoffset:-360; } }
@keyframes blink { 50% { opacity:0; } }
@media(prefers-reduced-motion:reduce) { .orbit,.signal,.flow,.cursor { animation:none; } }
</style>
<rect x="1" y="1" width="998" height="240" rx="18" fill="#080f10" stroke="#263f39"/>

<rect x="18" y="18" width="964" height="206" rx="10" fill="url(#grid)" opacity=".5"/>
<text x="32" y="40" class="label">02 / CAPSTONE</text>
<text x="40" y="111" font-size="44" font-weight="700" letter-spacing="-2">HoneySentinel<tspan style="fill:#edc775"> AI</tspan></text>
<text x="42" y="151" class="label">HONEYPOT / THREAT INTELLIGENCE</text>
<rect x="40" y="181" width="226" height="34" rx="17" fill="#101c1b" stroke="#263f39"/>
<text x="58" y="203" font-size="14">OPEN DEVELOPMENT FORK</text>
